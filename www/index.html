/* ---- sayı biçimlendirme ---- */
function fmt(n){
  n = Math.floor(n);
  if (n < 1000) return ''+n;
  const u = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
  let i = 0;
  while (n >= 1000 && i < u.length-1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i];
}
function fmtP(n){
  if (n >= 1000) return fmt(n);
  return (n < 10 ? n.toFixed(2) : n.toFixed(1)).replace(/\.?0+$/,'');
}
function F(size, color){
  return { fontFamily:'"Arial Black","Arial Bold",Arial,sans-serif', fontSize:size+'px',
           color:color||TXT.cream, stroke:C.outS, strokeThickness:Math.max(3, size*0.17) };
}

/* ==========================================================================
   ÇİZİM YARDIMCILARI
   ========================================================================== */
function mk(scene, key, w, h, fn){
  if (scene.textures.exists(key)) return;
  const g = scene.make.graphics({add:false});
  fn(g);
  g.generateTexture(key, w, h);
  g.destroy();
}
function box(g, col, x, y, w, h, r, lw){
  g.fillStyle(col,1); g.fillRoundedRect(x,y,w,h,r);
  if (lw !== 0){ g.lineStyle(lw||6, C.out, 1); g.strokeRoundedRect(x,y,w,h,r); }
}
function circ(g, col, x, y, r, lw){
  g.fillStyle(col,1); g.fillCircle(x,y,r);
  if (lw !== 0){ g.lineStyle(lw||6, C.out, 1); g.strokeCircle(x,y,r); }
}
function tri(g, col, pts, lw){
  g.fillStyle(col,1); g.fillPoints(pts, true);
  if (lw !== 0){ g.lineStyle(lw||6, C.out, 1); g.strokePoints(pts, true, true); }
}
/* alt tarafa yumuşak gölge — hacim hissi verir */
function shade(g, x, y, w, h, r){
  g.fillStyle(0x000000, 0.11); g.fillRoundedRect(x, y, w, h, r);
}
function light(g, x, y, w, h, r){
  g.fillStyle(0xffffff, 0.16); g.fillRoundedRect(x, y, w, h, r);
}

/* ==========================================================================
   KARAKTER ÇİZİMİ  (160 x 180 tuval)
   ========================================================================== */
function head(g, skin, r){
  box(g, skin, 44, 28, 72, 68, r===undefined?18:r);
  shade(g, 46, 74, 68, 20, 10);
  light(g, 50, 32, 60, 14, 8);
}
function torso(g, shirt){
  box(g, shirt, 38, 92, 84, 60, 18);
  shade(g, 40, 126, 80, 24, 14);
}
function hands(g, skin){
  circ(g, skin, 34, 122, 15);
  circ(g, skin, 126, 122, 15);
}
function eyes(g, y, sp){
  y = y||58; sp = sp||0;
  box(g, C.out, 60-sp, y, 11, 16, 5, 0);
  box(g, C.out, 89+sp, y, 11, 16, 5, 0);
  box(g, C.white, 62-sp, y+2, 4, 5, 2, 0);
  box(g, C.white, 91+sp, y+2, 4, 5, 2, 0);
}
function smile(g, y, w){
  y = y||82; w = w||22;
  box(g, C.out, 80-w/2, y, w, 6, 3, 0);
}

const BOX_COST = 30;                                // rastgele rozet kutusu (altın)

/* rozet bonusları — değişince recalcBadges() ile tazelenir */
let B = { prod:1, sell:1, tap:1, gift:false };
function recalcBadges(){
  B = { prod:1, sell:1, tap:1, gift:false };
  BADGES.forEach((b, i) => {
    if (!S.badges[i]) return;
    if (b.prod) B.prod += b.prod;
    if (b.sell) B.sell += b.sell;
    if (b.tap)  B.tap  += b.tap;
    if (b.gift) B.gift = true;
  });
}

function newFac(i){
  return {
    open: i === 0,
    xp: 0,
    robots: false,
    desks: Array.from({length:9}, (_,k) => ({ open: k === 0, w:0, lv:0, stock:0, prog:0 }))
  };
}
function newState(){
  return {
    cash: 0, gold: 0, fac: 0,
    facs: Array.from({length:FACS.length}, (_,i) => newFac(i)),
    tapLv: 0, speedLv: 0,
    stars: 0, runs: 0,                              // prestij
    badges: Array.from({length:BADGES.length}, () => false),
    snd: true,
    sold: 0, lifetime: 0, hired: 1, best: 0,
    t: Date.now()
  };
}
let S = newState();

const G = {
  f:       () => S.facs[S.fac],
  cfg:     () => FACS[S.fac],
  capOf:   d  => 5 + d.lv*5,
  star:    () => 1 + S.stars * STAR_BONUS,
  /* işçi gücü × masa seviyesi × kalıcı hız × rozet × yıldız × robot */
  rateOf:  (d, fi) => (1/BASE_TIME) * WORKERS[d.w].pw * (1 + d.lv*0.05)
                      * (1 + S.speedLv*0.10) * B.prod * G.star()
                      * (S.facs[fi].robots ? ROBOT_SPEED : 1),
  upCost:  (d,i,fi) => Math.floor(40 * Math.pow(1.5, d.lv) * FACS[fi].costMult * (1 + i*0.3)),
  hireCost:(w,i,fi) => Math.floor(WORKERS[w].cost * DESK_MULT[i] * FACS[fi].costMult),
  /* patron zamanla (satış yaptıkça) büyür */
  bossLv:  fi => Math.min(40, Math.floor(Math.log(1 + S.facs[fi].xp/20) / Math.log(1.8))),
  bossNext:fi => Math.ceil(20 * (Math.pow(1.8, G.bossLv(fi)+1) - 1)),
  bossTier:fi => { const l = G.bossLv(fi); return l>=18 ? 3 : l>=10 ? 2 : l>=5 ? 1 : 0; },
  price:   fi => FACS[fi].mult * Math.pow(1.32, G.bossLv(fi)) * B.sell * G.star(),
  tapPow:  () => (1 + S.tapLv*0.5) * B.tap,
  tapUpCost: () => 3 + S.tapLv*2,
  spdUpCost: () => 5 + S.speedLv*3,
  /* oto-satış: robotlar varsa her zaman, yoksa patron Sv.8'den sonra */
  autoOn:  fi => S.facs[fi].robots || G.bossLv(fi) >= AUTO_BOSS_LV,
  autoSec: fi => S.facs[fi].robots ? ROBOT_SELL
                                   : Math.max(0.8, 4 - (G.bossLv(fi)-AUTO_BOSS_LV)*0.2),
  /* robot işçiler: tüm masalar açık ve maksimum seviyede olunca satın alınabilir */
  robotReady: fi => S.facs[fi].desks.every(d => d.open && d.lv >= MAX_LV),
  robotCost:  fi => Math.floor(2.5e7 * FACS[fi].costMult),
  /* prestij: kazanılacak yıldız sayısı */
  starGain: () => Math.floor(Math.sqrt(S.sold / 50000)),
  starNext: () => Math.ceil(Math.pow(G.starGain() + 1, 2) * 50000)
};

/* ==========================================================================
   SES — dosya yok, tonlar WebAudio ile üretilir (çevrimdışı çalışır)
   ========================================================================== */
const Snd = {
  ctx: null,
  init(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f0, f1, dur, type, vol, delay){
    if (!S.snd || !this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  tap()  { this.tone(540, 700, 0.05, 'square',   0.025); },
  sell() { this.tone(880, 0, 0.09, 'triangle', 0.05); this.tone(1320, 0, 0.11, 'triangle', 0.045, 0.07); },
  buy()  { this.tone(440, 880, 0.13, 'triangle', 0.05); },
  err()  { this.tone(220, 120, 0.16, 'sawtooth', 0.04); },
  gift() { [660, 880, 1100, 1320].forEach((f,i) => this.tone(f, 0, 0.09, 'triangle', 0.045, i*0.06)); },
  big()  { [523, 659, 784, 1047, 1319].forEach((f,i) => this.tone(f, 0, 0.22, 'triangle', 0.055, i*0.11)); }
};

function save(){
  S.t = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
}
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return 0;
    const d = JSON.parse(raw);
    const base = newState();
    S = Object.assign(base, d);
    /* eski/eksik kayıtları onar */
    if (!Array.isArray(S.badges) || S.badges.length !== BADGES.length) S.badges = base.badges;
    S.badges = S.badges.map(x => !!x);
    S.stars = Math.max(0, S.stars|0);
    S.runs  = Math.max(0, S.runs|0);
    S.snd   = S.snd !== false;
    if (!S.lifetime) S.lifetime = S.sold || 0;
    if (!Array.isArray(S.facs) || S.facs.length !== FACS.length){
      S.facs = base.facs;
    } else {
      S.facs = S.facs.map((f, i) => {
        const nf = newFac(i);
        if (!f) return nf;
        nf.open = !!f.open; nf.xp = f.xp || 0; nf.robots = !!f.robots;
        if (Array.isArray(f.desks)){
          f.desks.forEach((d, k) => {
            if (k < 9 && d) nf.desks[k] = {
              open: !!d.open,
              w: Math.min(WORKERS.length-1, d.w|0),
              lv: Math.min(MAX_LV, d.lv|0),
              stock: d.stock|0, prog: d.prog||0
            };
          });
        }
        return nf;
      });
    }
    S.fac = Math.min(FACS.length-1, Math.max(0, S.fac|0));
    recalcBadges();
    const away = Math.min((Date.now() - (d.t||Date.now()))/1000, 8*3600);
    return away > 60 ? away : 0;
  } catch(e){ return 0; }
}

    this.load.setPath('art/');

    for (let i=0; i<WORKERS.length; i++) this.load.image('w'+i,    'w'+i+'.png');

    for (let i=0; i<PRODS.length; i++)   this.load.image('prod'+i, 'prod'+i+'.png');
    ['gift','desk','bossdesk','crate'].forEach(k => this.load.image(k, k+'.png'));
    this.load.on('loaderror', f => console.warn('görsel yüklenemedi, çizime düşüldü:', f.key));
  }

    this.buildTextures();

    this.boost = 0;
    this.buffCash = 0;
    this.buffTap = 0;
    this.autoT = 0;
    this.deskUI = [];
    this.sliding = false;

    this.world = this.add.container(0, 0);
    this.bgImg = this.add.image(0, 0, 'bg0').setOrigin(0);
    this.world.add(this.bgImg);

    this.buildBoss();
    this.buildDesks();
    this.buildHUD();
    this.buildBottomBar();
    this.buildPanel();

    /* ekrana dokunmak üretimi hızlandırır */
    this.input.on('pointerdown', p => {
      if (this.panelOpen) return;
      this.dragX = p.x; this.dragY = p.y;
      Snd.init(); Snd.tap();
      const add = 0.55 * G.tapPow() * (this.buffTap > 0 ? 10 : 1);
      const cap = 6 * G.tapPow() * (this.buffTap > 0 ? 10 : 1);
      this.boost = Math.min(this.boost + add, cap);
      this.ripple(p.x, p.y);
    });
    /* yana kaydırarak fabrika değiştir */
    this.input.on('pointerup', p => {
      if (this.panelOpen || this.dragX === undefined) return;
      const dx = p.x - this.dragX, dy = p.y - this.dragY;
      if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy)*1.6) this.switchFac(dx < 0 ? 1 : -1);
      this.dragX = undefined;
    });

    const away = load();
    this.renderFac();
    if (away) this.applyOffline(away);

    this.time.addEvent({ delay:5000, loop:true, callback: save });
    this.giftTimer = this.time.addEvent({ delay:Phaser.Math.Between(35000,60000), loop:true,

    window.addEventListener('pagehide', save);

    this._hidAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){ this._hidAt = Date.now(); save(); }
      else if (this._hidAt){
        const sec = Math.min((Date.now() - this._hidAt)/1000, 8*3600);
        this._hidAt = 0;
        if (sec > 20) this.applyOffline(sec);
      }
    });

  openPanel(key){
    this.panelBody.removeAll(true);

  panelFac(){
    this.panelTitle.setText('FABRİKALAR');
    FACS.forEach((f, i) => {
      if (i > 4) return;
      const y = 400 + i*84;
      const open = S.facs[i].open;
      const bg = this.add.rectangle(W/2, y, 580, 74, i === S.fac ? C.amberD : C.panelL).setStrokeStyle(5, C.out);
      const t1 = this.add.text(W/2-266, y-22, (i+1)+'. ' + f.name, F(20, open ? TXT.cream : '#a99a88'));
      const t2 = this.add.text(W/2-266, y+6,
        open ? (PRODS[f.prod] + ' · gelir ×' + fmt(f.mult) + ' · Patron Sv.' + G.bossLv(i))
             : ('Açılış: ' + fmt(f.unlock) + '₺'),
        F(15, open ? TXT.amber : '#c9b9a4'));
      const btn = this.add.rectangle(W/2+220, y, 116, 54,
        open ? C.green : (S.cash >= f.unlock ? C.gold : C.greyD)).setStrokeStyle(5, C.out).setInteractive({useHandCursor:true});
      const bt = this.add.text(W/2+220, y, open ? (i === S.fac ? 'BURADA' : 'GİT') : 'AÇ', F(16, TXT.cream)).setOrigin(0.5);
      btn.on('pointerdown', () => {
        if (open){ S.fac = i; this.closePanel(); this.renderFac(); this.shake(3); }
        else if (S.cash >= f.unlock){

          this.toast('+10 altın · ' + f.name + ' açıldı!', TXT.gold);
          S.fac = i; this.closePanel(); this.renderFac(); save();
        } else this.toast('Yetersiz nakit: ' + fmt(f.unlock) + '₺', TXT.red);

      this.panelBody.add([bg, t1, t2, btn, bt]);

    this.panelLayout(700, 660, 400, 100);
    this.panelTitle.setText('PATRON — ' + BOSSES[FACS[fi].boss]);

  /* ------------------------------------------------------- KOLEKSİYON ---- */
  panelColl(){
    const owned = S.badges.filter(Boolean).length;
    this.panelLayout(760, 676, 0, 0);
    this.panelTitle.setText('KOLEKSİYON  ' + owned + '/' + BADGES.length);
    const hint = this.add.text(W/2, 382, 'Rozetler altınla açılır, bonusları kalıcıdır', F(15, TXT.amber)).setOrigin(0.5);
    this.panelBody.add(hint);

    BADGES.forEach((b, i) => {
      const col = i%3, row = (i/3)|0;
      const x = 178 + col*182, y = 428 + row*126;
      const has = S.badges[i];
      const afford = S.gold >= b.cost;

      const bg = this.add.rectangle(x, y, 172, 114,
        has ? C.amberD : (afford ? C.panelL : C.panelD)).setStrokeStyle(5, has ? C.gold : C.out);
      const spr = this.add.image(x-52, y-4, 'w'+b.w).setScale(0.32);
      if (!has) spr.setAlpha(afford ? 0.85 : 0.45);
      const n1 = this.add.text(x+42, y-38, b.name, F(14, TXT.cream)).setOrigin(0.5);
      const n2 = this.add.text(x+42, y-8, b.desc, F(11, has ? TXT.green : TXT.amber))
                     .setOrigin(0.5).setWordWrapWidth(112);
      const n3 = this.add.text(x+42, y+30, has ? 'AÇIK ✔' : (b.cost + ' ⬤'),
                     F(15, has ? TXT.green : (afford ? TXT.gold : TXT.red))).setOrigin(0.5);

      bg.setInteractive({useHandCursor:true}).on('pointerdown', () => {
        if (has){ this.toast(b.name + ': ' + b.desc, TXT.green); return; }
        if (S.gold < b.cost){ Snd.err(); this.toast('Yetersiz altın: ' + b.cost, TXT.red); return; }
        S.gold -= b.cost; S.badges[i] = true; recalcBadges();
        Snd.buy(); this.toast(b.name + ' rozeti açıldı! ' + b.desc, TXT.gold);
        save(); this.reopen();
      });
      this.panelBody.add([bg, spr, n1, n2, n3]);
    });

    /* rastgele rozet kutusu */
    const locked = BADGES.map((b,i) => i).filter(i => !S.badges[i]);
    const by = 970;
    const bbg = this.add.rectangle(W/2, by, 560, 76,
      locked.length && S.gold >= BOX_COST ? C.blue : C.greyD).setStrokeStyle(5, C.out);
    const btx = this.add.text(W/2, by,
      locked.length ? ('KUTU AÇ — rastgele rozet  ·  ' + BOX_COST + ' ⬤')
                    : 'TÜM ROZETLER AÇILDI ✔', F(19, TXT.cream)).setOrigin(0.5);
    bbg.setInteractive({useHandCursor:true}).on('pointerdown', () => {
      if (!locked.length){ this.toast('Koleksiyon tamam!', TXT.green); return; }
      if (S.gold < BOX_COST){ Snd.err(); this.toast('Yetersiz altın: ' + BOX_COST, TXT.red); return; }
      S.gold -= BOX_COST;
      const pick = locked[Math.floor(Math.random()*locked.length)];
      S.badges[pick] = true; recalcBadges();
      Snd.gift();
      this.toast('Kutudan çıktı: ' + BADGES[pick].name + ' — ' + BADGES[pick].desc, TXT.gold);
      save(); this.reopen();
    });
    this.panelBody.add([bbg, btx]);
  }

  /* --------------------------------------------------------- PRESTİJ ---- */
  prestige(){
    const gain = G.starGain();
    if (gain <= 0){
      Snd.err();
      this.toast('Henüz yeterli üretim yok — ' + fmt(G.starNext()) + ' ürün gerekli', TXT.red);
      return;
    }
    if (!this._pst){
      this._pst = true;
      this.toast(gain + ' yıldız için şirketi satmak üzeresin — tekrar dokun', TXT.amber);
      this.time.delayedCall(3000, () => this._pst = false);
      return;
    }
    this._pst = false;
    S.stars += gain; S.runs++;
    /* sıfırlananlar: nakit, fabrikalar, işçiler, masalar, patron seviyeleri
       kalanlar: yıldız, altın, rozetler, altınla alınan kalıcı güçler        */
    S.cash = 0; S.fac = 0; S.sold = 0; S.hired = 1;
    S.facs = Array.from({length:FACS.length}, (_,i) => newFac(i));
    Snd.big(); this.shake(14);
    this.closePanel(); this.renderFac(); save();
    this.float(W/2, 620, '+' + gain + ' YILDIZ', TXT.gold, 44);
    this.toast('Şirket satıldı! Toplam ' + S.stars + ' yıldız · üretim ve gelir ×' + G.star().toFixed(2), TXT.gold);
  }

  /* ------------------------------------------------- İŞÇİ SEÇME EKRANI ---- */
  openWorkerPick(deskIdx, replacing){
    const d = G.f().desks[deskIdx];
    if (replacing && !d.open) return;
    if (!replacing && d.open) return;

    this.panelBody.removeAll(true);
    this.panelOpen = true;
    this.panel.setVisible(true);
    this._key = null;
    this.panelCard.setSize(660, 760).setPosition(W/2, 668);
    this.panelTitle.setText(replacing ? ('MASA ' + (deskIdx+1) + ' — İŞÇİ DEĞİŞTİR')
                                      : ('MASA ' + (deskIdx+1) + ' — İŞÇİ SEÇ'));

    const hint = this.add.text(W/2, 386, 'Güçlü işçi daha çok üretir, daha pahalıdır', F(15, TXT.amber)).setOrigin(0.5);
    this.panelBody.add(hint);

    WORKERS.forEach((wk, wi) => {
      const col = wi%3, row = (wi/3)|0;
      const x = 178 + col*182;
      const y = 480 + row*146;
      const cost = G.hireCost(wi, deskIdx, S.fac);
      const afford = S.cash >= cost;
      const current = replacing && d.w === wi;

      const bg = this.add.rectangle(x, y, 172, 134,
        current ? C.amberD : (afford ? C.panelL : C.panelD)).setStrokeStyle(5, current ? C.gold : C.out);
      const spr = this.add.image(x-48, y-8, 'w'+wi).setScale(0.44);
      if (!afford && !current) spr.setAlpha(0.5);
      const n1 = this.add.text(x+50, y-46, wk.name, F(15, TXT.cream)).setOrigin(0.5);
      const n2 = this.add.text(x+50, y-16, '⚒ ×' + fmtP(wk.pw), F(17, TXT.green)).setOrigin(0.5);
      const n3 = this.add.text(x+50, y+16, fmt(cost) + '₺', F(16, afford ? TXT.gold : TXT.red)).setOrigin(0.5);
      const n4 = this.add.text(x, y+52, current ? 'ŞU AN ÇALIŞIYOR' : (afford ? 'DOKUN VE AL' : 'yetersiz nakit'),
                               F(12, current ? TXT.gold : (afford ? TXT.cream : '#c9a9a4'))).setOrigin(0.5);

      bg.setInteractive({useHandCursor:true}).on('pointerdown', () => {
        if (current){ this.toast('Bu işçi zaten burada', TXT.amber); return; }
        if (S.cash < cost){ this.toast('Yetersiz nakit: ' + fmt(cost) + '₺', TXT.red); return; }
        S.cash -= cost; Snd.buy();
        d.w = wi;
        if (!d.open){ d.open = true; S.hired++; S.gold += 3; this.toast('+3 altın · ' + wk.name + ' işbaşı!', TXT.gold); }
        else this.toast(wk.name + ' masaya geçti!', TXT.green);
        this.closePanel(); this.renderFac(); this.pop(this.deskUI[deskIdx].worker); save();
      });
      this.panelBody.add([bg, spr, n1, n2, n3, n4]);
    });
  }

  trophyText(){
    let n = 0;
    if (S.hired >= 3) n++;
    if (S.hired >= 9) n++;
    if (S.sold >= 10000) n++;
    if (S.facs.filter(f => f.open).length >= 2) n++;
    if (S.facs.some((f,i) => G.bossLv(i) >= AUTO_BOSS_LV)) n++;
    if (S.facs.some(f => f.desks.every(d => d.open && d.lv >= MAX_LV))) n++;
    if (S.facs.some(f => f.robots)) n++;
    if (S.stars > 0) n++;
    if (S.badges.every(Boolean)) n++;
    return n + ' / 9 kupa';
  }

  /* -------------------------------------------------------------- aksiyonlar */
  switchFac(dir){
    if (this.sliding) return;
    let n = S.fac + dir;
    if (n < 0 || n >= FACS.length) return;
    if (!S.facs[n].open){
      const f = FACS[n];
      this.toast(f.name + ' kilitli — ' + fmt(f.unlock) + '₺ (FABRİKA menüsü)', TXT.amber);
      return;
    }
    /* İçerik ÖNCE değişir, kaydırma sadece süstür. Tween yarıda kalırsa
       (uygulama arkaya atılırsa) oyun yanlış fabrikada takılı kalmasın. */
    S.fac = n;
    this.renderFac();
    this.tweens.killTweensOf(this.world);
    this.sliding = true;
    this.world.x = dir * W;
    const done = () => { this.world.x = 0; this.sliding = false; };
    this.tweens.add({ targets:this.world, x:0, duration:220, ease:'Cubic.easeOut',
                      onComplete: done, onStop: done });
  }

  upgradeDesk(i){
    const d = G.f().desks[i];
    if (!d.open) return;
    if (d.lv >= MAX_LV){ this.toast('Masa zaten maksimum!', TXT.amber); return; }
    const c = G.upCost(d, i, S.fac);
    if (S.cash < c){ this.toast('Yetersiz nakit: ' + fmt(c) + '₺', TXT.red); return; }
    S.cash -= c; d.lv++; Snd.buy();
    if (d.lv % 5 === 0){ S.gold += 2; this.toast('+2 altın · Masa Sv.' + (d.lv+1), TXT.gold); }
    this.pop(this.deskUI[i].desk);
    this.chips(this.deskUI[i].cx, this.deskUI[i].cy + 20, 6);
    this.refreshHUD();
    save();
  }

  sellAll(auto){
    const fi = S.fac, f = G.f();
    let total = 0;
    f.desks.forEach(d => { total += d.stock; d.stock = 0; });
    if (total === 0){ if (!auto) this.toast('Satacak ürün yok!', TXT.red); return; }

    const mult = this.buffCash > 0 ? 2 : 1;
    const money = total * G.price(fi) * mult;
    S.cash += money; S.sold += total; S.lifetime += total; f.xp += total;
    if (S.cash > S.best) S.best = S.cash;

    this.pop(this.bossSpr, 1.14);
    if (!auto){ this.shake(6); Snd.sell(); }
    this.float(W/2, 208, '+' + fmt(money) + '₺' + (mult>1 ? ' ×2' : ''), TXT.green, 30);

    for (let k=0; k<Math.min(total, 10); k++){
      const src = this.deskUI[k % 9];
      const t = this.add.image(src.cx+66, src.cy-10, 'prod'+FACS[fi].prod).setScale(0.28).setDepth(30);
      this.tweens.add({ targets:t, x:W/2, y:266, scale:0.07, duration:320 + k*24, ease:'Cubic.easeIn',
                        onComplete: () => t.destroy() });
    }
    this.renderFac();
  }

  applyOffline(sec){
    let made = 0;
    S.facs.forEach((f, fi) => {
      if (!f.open) return;
      f.desks.forEach(d => {
        if (!d.open) return;
        const cap = G.capOf(d);
        const n = Math.min(cap - d.stock, Math.floor(G.rateOf(d, fi) * sec));
        if (n > 0){ d.stock += n; made += n; }
      });
    });
    if (made > 0){
      this.toast('Yokken ' + fmt(made) + ' ürün üretildi (' + Math.floor(sec/60) + ' dk)', TXT.gold);
      this.renderFac();
    }
  }

  spawnGift(){
    if (this.gift && this.gift.active) return;
    const y = Phaser.Math.Between(420, 1020);
    const fromLeft = Math.random() < 0.5;
    const g = this.add.image(fromLeft ? -80 : W+80, y, 'gift').setDepth(40).setScale(0.78);
    g.setInteractive({useHandCursor:true});
    this.gift = g;
    this.tweens.add({ targets:g, y:y-40, duration:520, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    this.tweens.add({ targets:g, x: fromLeft ? W+90 : -90, duration:9500, ease:'Linear',
                      onComplete: () => g.destroy() });
    g.on('pointerdown', () => {
      const r = Math.random();
      Snd.gift();
      if (r < 0.4){ const a = Phaser.Math.Between(5,15); S.gold += a; this.float(g.x, g.y, '+'+a+' ALTIN', TXT.gold, 30); }
      else if (r < 0.7){ this.buffCash = 30; this.float(g.x, g.y, '2x PARA · 30sn', TXT.green, 27); }
      else { this.buffTap = 20; this.float(g.x, g.y, '10x TIKLAMA · 20sn', '#ffb0e8', 25); }
      g.destroy(); this.refreshHUD(); save();
    });
  }

  /* ----------------------------------------------------------------- efekt */
  toast(msg, col){
    if (this.toastObj) this.toastObj.destroy();
    const t = this.add.text(W/2, 1118, msg, F(21, col || TXT.cream)).setOrigin(0.5).setDepth(60);
    this.toastObj = t;
    this.tweens.add({ targets:t, y:1088, alpha:0, delay:1000, duration:600, onComplete: () => t.destroy() });
  }
  float(x, y, msg, col, size){
    const t = this.add.text(x, y, msg, F(size||24, col)).setOrigin(0.5).setDepth(60);
    this.tweens.add({ targets:t, y:y-92, alpha:0, duration:900, onComplete: () => t.destroy() });
  }
  pop(obj, sc){
    this.tweens.add({ targets:obj, scaleX:obj.scaleX*(sc||1.15), scaleY:obj.scaleY*(sc||1.15),
                      duration:90, yoyo:true });
  }
  ripple(x, y){
    const c = this.add.circle(x, y, 12, 0xfff6e6, 0.45).setDepth(45);
    this.tweens.add({ targets:c, radius:48, alpha:0, duration:280, onComplete: () => c.destroy() });
  }
  shake(px){ this.cameras.main.shake(160, px/1000); }
  chips(x, y, n){
    for (let k=0; k<n; k++){
      const c = this.add.image(x, y, 'chip').setDepth(32);
      this.tweens.add({
        targets:c, x: x + Phaser.Math.Between(-60,60), y: y - Phaser.Math.Between(20,70),
        alpha:0, angle: Phaser.Math.Between(-180,180), duration:520,
        onComplete: () => c.destroy()
      });
    }
  }

  /* ------------------------------------------------------------- güncelleme */
  refreshHUD(){
    const fi = S.fac;
    this.goldTxt.setText(fmt(S.gold));
    this.cashTxt.setText(fmt(S.cash) + '₺');
    this.frameTxt.setText(fmtP(G.price(fi)) + '₺');

    this.facTxt.setText(FACS[fi].name);
    const nextLocked = S.facs.findIndex(f => !f.open);
    this.facSub.setText((fi+1) + '/' + FACS.length + '  ·  ' + PRODS[FACS[fi].prod]);
    this.arrowL.setAlpha(fi > 0 ? 1 : 0.28);
    this.arrowR.setAlpha(fi < FACS.length-1 ? (S.facs[fi+1] && S.facs[fi+1].open ? 1 : 0.55) : 0.28);

    this.starTxt.setText(S.stars > 0 ? '★ ' + S.stars + '  ×' + G.star().toFixed(2) : '');
    if (this.collDot) this.collDot.setVisible(S.badges.some((h,i) => !h && S.gold >= BADGES[i].cost));
    let b = '';
    if (this.buffCash > 0) b += '2x PARA ' + Math.ceil(this.buffCash) + 's\n';
    if (this.buffTap  > 0) b += '10x TIK ' + Math.ceil(this.buffTap) + 's';
    this.buffTxt.setText(b);
    this.boostTxt.setText(this.boost > 0.15 ? 'HIZ ×' + (1+this.boost).toFixed(1) : '');

    /* patron büyüme çubuğu */
    const lv = G.bossLv(fi), f = S.facs[fi];
    const prev = lv === 0 ? 0 : Math.ceil(20 * (Math.pow(1.8, lv) - 1));
    const next = G.bossNext(fi);
    const p = Phaser.Math.Clamp((f.xp - prev) / Math.max(1, next - prev), 0, 1);
    this.bossBar.width = Math.max(6, 242*p);
    this.bossTxt.setText('PATRON Sv.' + lv + (lv >= AUTO_BOSS_LV ? '  ★' : ''));
  }

  refreshDesk(i){
    const u = this.deskUI[i], d = G.f().desks[i];

    if (!d.open){
      u.lockG.setVisible(true);
      u.worker.setVisible(false);
      u.chip.setVisible(false);
      u.stackTxt.setVisible(false);
      const cheapest = G.hireCost(0, i, S.fac);
      u.lockPrice.setText(fmt(cheapest) + '₺ +');
      return;
    }
    u.lockG.setVisible(false);
    u.worker.setVisible(true).setTexture(G.f().robots ? 'w9' : 'w' + d.w);
    u.chip.setVisible(true);

    const maxed = d.lv >= MAX_LV;
    u.chipTxt.setText(maxed ? 'MAKS · 100 ürün'
                            : 'Sv.' + (d.lv+1) + '  ⬆ ' + fmt(G.upCost(d, i, S.fac)) + '₺');
    u.chipBg.fillColor = maxed ? C.greyD : (S.cash >= G.upCost(d, i, S.fac) ? C.green : C.greyD);
  }

  refreshStack(i){
    const u = this.deskUI[i], d = G.f().desks[i];
    const key = 'prod' + FACS[S.fac].prod;
    if (u.lastStock === d.stock && u.lastProd === key) return;
    u.lastStock = d.stock; u.lastProd = key;

    const show = Math.min(d.stock, 4);
    while (u.toys.length < show){
      const t = this.add.image(0, -u.toys.length*20, key).setScale(0.36);
      u.stack.add(t); u.toys.push(t);
    }
    while (u.toys.length > show){ u.toys.pop().destroy(); }
    u.toys.forEach(t => t.setTexture(key));
    u.stackTxt.setText(d.stock > 0 ? '×' + d.stock : '');
    u.stackTxt.setY(u.cy + 4 - show*20 - 16);
    u.stackTxt.setVisible(d.stock > 0);
  }

  /* fabrika değişince tüm görseli tazele */
  renderFac(){
    const fi = S.fac, cfg = FACS[fi];
    this.bgImg.setTexture('bg' + fi);
    this.bossSpr.setTexture('b' + cfg.boss);
    this.frameIco.setTexture('prod' + cfg.prod);

    /* patron sattıkça büyür: hem ölçeği artar hem aksesuar kazanır */
    const lv = G.bossLv(fi), tier = G.bossTier(fi);
    this.bossSpr.setScale(0.40 + Math.min(lv, 24)*0.005);      // 0.40 → 0.52
    const dh = this.bossSpr.displayHeight;
    if (tier === 0) this.bossAcc.setVisible(false);
    else {
      /* 1: papyon (göğüs)  2: altın zincir (boyun)  3: taç (baş üstü) */
      this.accOff = tier === 3 ? -dh*0.95 : tier === 2 ? -dh*0.60 : -dh*0.55;
      this.bossAcc.setVisible(true).setTexture('acc' + tier)
        .setY(this.bossSpr.y + this.accOff)
        .setScale(0.34 + Math.min(lv, 24)*0.006);
    }
    this.deskUI.forEach(u => { u.lastStock = -1; });
    this.refreshHUD();
    for (let i=0; i<9; i++){ this.refreshDesk(i); this.refreshStack(i); }
  }

  update(time, delta){
    const dt = Math.min(delta/1000, 0.25);

    if (this.boost > 0)    this.boost = Math.max(0, this.boost - dt*0.9);
    if (this.buffCash > 0) this.buffCash = Math.max(0, this.buffCash - dt);
    if (this.buffTap > 0)  this.buffTap = Math.max(0, this.buffTap - dt);

    const mult = 1 + this.boost;

    /* açık TÜM fabrikalar üretir; sadece görünen fabrika çizilir */
    S.facs.forEach((f, fi) => {
      if (!f.open) return;
      const visible = fi === S.fac;
      f.desks.forEach((d, i) => {
        if (!d.open) return;
        const cap = G.capOf(d);
        if (d.stock < cap){
          d.prog += G.rateOf(d, fi) * (visible ? mult : 1) * dt;
          while (d.prog >= 1 && d.stock < cap){ d.prog -= 1; d.stock++; }
          if (d.stock >= cap) d.prog = 0;
        } else d.prog = 0;
      });
    });

    /* patron büyüdüyse kendi satar */
    this.autoT += dt;
    const fi = S.fac;
    if (G.autoOn(fi) && this.autoT >= G.autoSec(fi)){
      this.autoT = 0;
      if (G.f().desks.some(d => d.stock > 0)) this.sellAll(true);
    }

    /* görünen fabrikanın çizimi */
    for (let i=0; i<9; i++){
      const d = G.f().desks[i], u = this.deskUI[i];
      u.pie.clear();
      if (!d.open) continue;

      const cap = G.capOf(d);
      const px = u.cx - 62, py = u.cy + 40, r = 17;
      u.pie.fillStyle(C.cream, 1); u.pie.fillCircle(px, py, r);
      u.pie.fillStyle(d.stock >= cap ? C.red : C.green, 1);
      u.pie.slice(px, py, r-2, Phaser.Math.DegToRad(-90),
                  Phaser.Math.DegToRad(-90 + 360*(d.stock >= cap ? 1 : d.prog)), false);
      u.pie.fillPath();
      u.pie.lineStyle(5, C.out, 1); u.pie.strokeCircle(px, py, r);

      u.worker.y = u.cy - 46 + Math.sin(time*0.006*mult + i) * (2 + this.boost*0.6);
      this.refreshStack(i);
    }

    if (this.bossAcc.visible) this.bossAcc.y = this.bossSpr.y + this.accOff;

    /* güvenlik ağı: kaydırma yarıda kesildiyse dünyayı yerine oturt */
    if (!this.sliding && this.world.x !== 0) this.world.x = 0;

    if (!this._acc || time - this._acc > 200){
      this._acc = time;
      this.refreshHUD();
      for (let i=0; i<9; i++) this.refreshDesk(i);
    }
  }
}

window.GAME = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#2a1d12',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: W, height: H },
  render: { antialias: true, roundPixels: false },
  scene: [Game]
});
</script>
